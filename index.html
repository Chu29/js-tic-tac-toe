<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/index.css" />
    <title>Tikki-Takka</title>
  </head>
  <body>
    <div class="winner-msg-container">
      <p class="win-msg">Winner</p>
      <button id="new-game">New Game</button>
    </div>
    <main>
      <h1>Tic Tac Toe</h1>
      <div class="container">
        <div class="game">
          <button class="box1"></button>
          <button class="box2"></button>
          <button class="box3"></button>
          <button class="box4"></button>
          <button class="box5"></button>
          <button class="box6"></button>
          <button class="box7"></button>
          <button class="box8"></button>
          <button class="box9"></button>
        </div>
      </div>
      <button id="reset">Reset Game</button>
    </main>
    <script src="scripts/app.js"></script>
  </body>
</html>
